<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function exFuncao(nome){
            document.getElementById("cod2").innerHTML = `Usuario USB: ${nome}`;
        }
    </script>
</head>
<body>
    <h2>Aula sobre JavaScript</h2>

    <button onclick="alert('CARALHONNNNNNN')">ENFIA O DEDO</button>

    <button onclick="exFuncao('Alan')">Usuario USB: </button>
    
    <p id="cod1"></p>
    <p id="cod2">Disciplina</p>

    <script>
        document.getElementById("cod1").innerHTML = "INHAIIIIIII"
    </script>
</body>
</html>
