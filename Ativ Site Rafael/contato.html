        <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-sizes">

                    <img src="img/cartoon-network-cn-logo-hd-png-701751694708568zxoq18qbzl.png" alt="Cartoon Network"
                        width="90" height="80" style="padding-left: 10px;">
                </a>
            </div>
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Início</a>

                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="espacamento">
            <h2 class="font-text">Entre em Contato</h2>
            
            <form class="espacamento" style="width: 500px;">
                <div class="row mb-4">
                    <label for="inputName" class="col-sm-3 col-form-label" style="padding-top: 20px;">Nome</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="inputName" placeholder="Seu nome completo" required>
                    </div>
                </div>

                <div class="row mb-4">
                    <label for="inputEmail" class="col-sm-3 col-form-label">Email</label>
                    <div class="col-sm-9">
                        <input type="email" class="form-control" id="inputEmail" placeholder="seu.email@email.com" required>
                    </div>
                </div>

                <div class="row mb-4">
                    <label for="inputPhone" class="col-sm-3 col-form-label">Telefone</label>
                    <div class="col-sm-9">
                        <input type="tel" class="form-control" id="inputPhone" placeholder="(11) 99999-9999">
                    </div>
                </div>

                <div class="row mb-4">
                    <label for="inputSubject" class="col-sm-3 col-form-label">Assunto</label>
                    <div class="col-sm-9">
                        <select class="form-select" id="inputSubject" required>
                            <option selected disabled>Selecione um assunto</option>
                            <option>Sugestão de Programa</option>
                            <option>Reclamação</option>
                            <option>Elogio</option>
                            <option>Parceria</option>
                            <option>Outro</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <label for="inputMessage" class="col-sm-3 col-form-label">Mensagem</label>
                    <div class="col-sm-9">
                        <textarea class="form-control" id="inputMessage" rows="5" placeholder="Digite sua mensagem aqui..." required></textarea>
                    </div>
                </div>

                <div class="form-actions">
                        <button type="submit" class="btn btn-card">Enviar</button>
                    </div>
                    
                </div>
            </form>
        </section>
    </main>
