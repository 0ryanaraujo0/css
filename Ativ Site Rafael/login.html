    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-sizes">
            <div>
                <a class="navbar-brand" href="#">
                    <img src="img/cartoon-network-cn-logo-hd-png-701751694708568zxoq18qbzl.png" alt="Bootstrap"
                        width="90" height="80" style="padding-left: 10px;" ;>
                </a>
            </div>
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="classicos.html">Clássicos</a>

                    </ul>
                </div>
                </div>
            </div>
        </nav>
    </header>
<main>
        <section class="espacamento">
            <div class="form-wrapper">
                <h2 class="font-text">Acesse sua Conta</h2>

                <form class="login-form">
                    <div class="form-group">
                        <label for="inputEmail">Email</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="seu.email@exemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="inputPassword">Senha</label>
                        <input type="password" class="form-control" id="inputPassword" placeholder="Digite sua senha" required>
                    </div>

                    <div class="form-group">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Lembrar-me
                            </label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-card">Entrar</button>
                    </div>

                    <div class="form-footer">
                        <p><a href="#">Recuperar Senha</a></p>
                        <p>Não possui conta? <a href="#">Cadastre-se aqui</a></p>
                    </div>
                </form>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
