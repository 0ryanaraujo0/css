<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QualiElo-Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="login-container">

        <div class="logo-box">
            <i class="bi bi-lightning-fill"></i>
        </div>

        <h1>Quali<span>Elo</span></h1>
        <p>Sistema de Controle de Qualidade</p>

      <form action="dashbord.html">

    <!-- USUÁRIO -->
    <div class="input-group">

        <label>Usuário</label>

        <div class="input-box">

            <i class="bi bi-person"></i>

            <input 
                id="usuario"
                type="text"
                placeholder="Digite seu usuário"
                required
            />

        </div>

    </div>

    <!-- SENHA -->
    <div class="input-group">

        <label>Senha</label>

        <div class="input-box">

            <i class="bi bi-lock"></i>

            <input 
                id="senha"
                type="password"
                placeholder="Digite sua senha"
                required
            />

        </div>
        
            
          <div class="mb-3">
            <label for="assunto" class="form-label">Acesso</label>
            <select class="form-select" id="acesso">
              <option selected>Selecione o seu cargo</option>
              <option value="gerente">GERENTE</option>
              <option value="inspetor">INSPETOR</option>
              <option value="lider">LÍDER</option>
            </select>
          </div>
    </div>

    <!-- BOTÃO -->
    <button type="submit">
        Acessar Sistema
    </button>

</form>

        </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<script src="js/dash.js"></script>

</body>

</html>
